<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — HRM Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: #0a0e1a;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.12) 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 20%, rgba(139,92,246,0.10) 0%, transparent 50%),
                  radial-gradient(ellipse at 60% 80%, rgba(34,211,238,0.07) 0%, transparent 50%);
      animation: bgFloat 12s ease-in-out infinite alternate;
    }
    @keyframes bgFloat {
      0% { transform: translate(0,0) rotate(0deg); }
      100% { transform: translate(2%, 2%) rotate(2deg); }
    }

    .login-card {
      position: relative;
      z-index: 1;
      width: 420px;
      padding: 48px 44px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05) inset;
    }

    .login-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 36px;
    }
    .login-logo {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1px;
      box-shadow: 0 8px 24px rgba(99,102,241,0.4);
    }
    .login-brand-text { display: flex; flex-direction: column; }
    .login-brand-name { font-size: 20px; font-weight: 800; color: #f1f5f9; letter-spacing: -0.5px; }
    .login-brand-sub  { font-size: 12px; color: #64748b; margin-top: 1px; }

    .login-title {
      font-size: 24px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 6px;
    }
    .login-subtitle {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 12px;
      color: #f1f5f9;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: all 0.2s;
    }
    .form-input::placeholder { color: #475569; }
    .form-input:focus {
      border-color: #6366f1;
      background: rgba(99,102,241,0.08);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }

    .error-box {
      padding: 12px 16px;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px;
      color: #f87171;
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
    }
    .error-box.show { display: block; }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
      box-shadow: 0 8px 24px rgba(99,102,241,0.35);
      position: relative;
      overflow: hidden;
    }
    .btn-login:hover { transform: translateY(-1px); box-shadow: 0 12px 30px rgba(99,102,241,0.45); }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .login-footer {
      margin-top: 28px;
      text-align: center;
      font-size: 11.5px;
      color: #475569;
    }

    /* Loading spinner */
    .spinner-sm {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .role-hint {
      margin-top: 20px;
      padding: 12px 16px;
      background: rgba(99,102,241,0.08);
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: 10px;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.8;
    }
    .role-hint strong { color: #a5b4fc; }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-brand">
    <div class="login-logo">HRM</div>
    <div class="login-brand-text">
      <span class="login-brand-name">HRM Pro</span>
      <span class="login-brand-sub">Quản lý Nguồn lực Nhân sự</span>
    </div>
  </div>

  <div class="login-title">Đăng nhập</div>
  <div class="login-subtitle">Nhập thông tin tài khoản để truy cập hệ thống quản lý.</div>

  <div class="error-box" id="errorBox"></div>

  <form id="loginForm" autocomplete="off">
    <div class="form-group">
      <label class="form-label" for="username">Tên đăng nhập</label>
      <input id="username" class="form-input" type="text" placeholder="Nhập username..." autocomplete="username" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Mật khẩu</label>
      <input id="password" class="form-input" type="password" placeholder="Nhập mật khẩu..." autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-login" id="btnLogin">Đăng nhập</button>
  </form>

  <div class="role-hint">
    Tài khoản quản trị mặc định:<br>
    Username: <strong>admin</strong> &nbsp;|&nbsp; Mật khẩu: <strong>Admin@123</strong>
  </div>

  <div class="login-footer">
    HRM Pro &copy; 2026 &mdash; Hệ thống quản lý nội bộ
  </div>
</div>

<script>
  // Nếu đã có token hợp lệ → tự redirect về trang chính
  const token = localStorage.getItem('hrm_token');
  if (token) {
    fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } })
      .then(r => { if (r.ok) window.location.href = '/'; })
      .catch(() => {});
  }

  const form    = document.getElementById('loginForm');
  const btn     = document.getElementById('btnLogin');
  const errBox  = document.getElementById('errorBox');

  function showError(msg) {
    errBox.textContent = msg;
    errBox.classList.add('show');
  }
  function hideError() { errBox.classList.remove('show'); }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) { showError('Vui lòng nhập đầy đủ thông tin.'); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-sm"></span>Đang đăng nhập...';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        showError(data.error || 'Đăng nhập thất bại.');
        btn.disabled = false;
        btn.textContent = 'Đăng nhập';
        return;
      }
      // Lưu token và thông tin user
      localStorage.setItem('hrm_token', data.token);
      localStorage.setItem('hrm_user', JSON.stringify(data.user));
      // Redirect về trang chính
      window.location.href = '/';
    } catch (err) {
      showError('Lỗi kết nối. Vui lòng thử lại.');
      btn.disabled = false;
      btn.textContent = 'Đăng nhập';
    }
  });
</script>
</body>
</html>
