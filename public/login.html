<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập & Đăng ký — HRM Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: #0a0e1a;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.12) 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 20%, rgba(139,92,246,0.10) 0%, transparent 50%),
                  radial-gradient(ellipse at 60% 80%, rgba(34,211,238,0.07) 0%, transparent 50%);
      animation: bgFloat 12s ease-in-out infinite alternate;
    }
    @keyframes bgFloat {
      0% { transform: translate(0,0) rotate(0deg); }
      100% { transform: translate(2%, 2%) rotate(2deg); }
    }

    .login-card {
      position: relative;
      z-index: 1;
      width: 420px;
      padding: 48px 44px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05) inset;
    }

    .login-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 30px;
    }
    .login-logo {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1px;
      box-shadow: 0 8px 24px rgba(99,102,241,0.4);
    }
    .login-brand-text { display: flex; flex-direction: column; }
    .login-brand-name { font-size: 20px; font-weight: 800; color: #f1f5f9; letter-spacing: -0.5px; }
    .login-brand-sub  { font-size: 12px; color: #64748b; margin-top: 1px; }

    /* Tabs */
    .tabs {
      display: flex;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 12px 0;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      position: relative;
      transition: color 0.2s;
    }
    .tab-btn:hover { color: #f1f5f9; }
    .tab-btn.active { color: #fff; }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 2px;
      background: #6366f1;
      border-radius: 2px 2px 0 0;
    }

    .form-container { display: none; }
    .form-container.active { display: block; }

    .login-subtitle {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 12px;
      color: #f1f5f9;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: all 0.2s;
    }
    .form-input::placeholder { color: #475569; }
    .form-input:focus {
      border-color: #6366f1;
      background: rgba(99,102,241,0.08);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }

    .error-box, .success-box {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
    }
    .error-box { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #f87171; }
    .success-box { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #4ade80; }
    .error-box.show, .success-box.show { display: block; }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
      box-shadow: 0 8px 24px rgba(99,102,241,0.35);
      position: relative;
      overflow: hidden;
    }
    .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 12px 30px rgba(99,102,241,0.45); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .login-footer {
      margin-top: 28px;
      text-align: center;
      font-size: 11.5px;
      color: #475569;
    }

    .spinner-sm {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-brand">
    <div class="login-logo">HRM</div>
    <div class="login-brand-text">
      <span class="login-brand-name">HRM Pro</span>
      <span class="login-brand-sub">Quản lý Nguồn lực Nhân sự</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="login">Đăng nhập</button>
    <button class="tab-btn" data-tab="register">Đăng ký</button>
  </div>

  <div class="error-box" id="errorBox"></div>
  <div class="success-box" id="successBox"></div>

  <!-- LOGIN FORM -->
  <div class="form-container active" id="loginTab">
    <div class="login-subtitle">Nhập thông tin tài khoản để truy cập hệ thống quản lý.</div>
    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label class="form-label" for="loginUser">Tên đăng nhập</label>
        <input id="loginUser" class="form-input" type="text" placeholder="Nhập username..." required>
      </div>
      <div class="form-group">
        <label class="form-label" for="loginPass">Mật khẩu</label>
        <input id="loginPass" class="form-input" type="password" placeholder="Nhập mật khẩu..." required>
      </div>
      <button type="submit" class="btn-submit" id="btnLogin">Đăng nhập</button>
    </form>
  </div>

  <!-- REGISTER FORM -->
  <div class="form-container" id="registerTab">
    <div class="login-subtitle">Tạo tài khoản mới để tham gia hệ thống.</div>
    <form id="registerForm" autocomplete="off">
      <div class="form-group">
        <label class="form-label" for="regName">Họ và tên</label>
        <input id="regName" class="form-input" type="text" placeholder="Nhập họ và tên..." required>
      </div>
      <div class="form-group">
        <label class="form-label" for="regUser">Tên đăng nhập (Username)</label>
        <input id="regUser" class="form-input" type="text" placeholder="Chọn username..." required minlength="3">
      </div>
      <div class="form-group">
        <label class="form-label" for="regEmail">Email</label>
        <input id="regEmail" class="form-input" type="email" placeholder="Nhập email...">
      </div>
      <div class="form-group">
        <label class="form-label" for="regPass">Mật khẩu</label>
        <input id="regPass" class="form-input" type="password" placeholder="Nhập mật khẩu..." required minlength="8">
      </div>
      <button type="submit" class="btn-submit" id="btnRegister">Đăng ký</button>
    </form>
  </div>

  <div class="login-footer">
    HRM Pro &copy; 2026 &mdash; Hệ thống quản lý nội bộ
  </div>
</div>

<script>
  const token = localStorage.getItem('hrm_token');
  if (token) {
    fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } })
      .then(r => { if (r.ok) window.location.href = '/'; })
      .catch(() => {});
  }

  // UI logic
  const tabs = document.querySelectorAll('.tab-btn');
  const forms = document.querySelectorAll('.form-container');
  const errBox = document.getElementById('errorBox');
  const succBox = document.getElementById('successBox');

  function showMsg(msg, isErr = true) {
    errBox.className = 'error-box'; succBox.className = 'success-box';
    if(isErr) { errBox.textContent = msg; errBox.classList.add('show'); }
    else { succBox.textContent = msg; succBox.classList.add('show'); }
  }
  function hideMsg() { errBox.className = 'error-box'; succBox.className = 'success-box'; }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      forms.forEach(f => f.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.tab + 'Tab').classList.add('active');
      hideMsg();
    });
  });

  // Login Handle
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMsg();
    const btn = document.getElementById('btnLogin');
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value;

    btn.disabled = true; btn.innerHTML = '<span class="spinner-sm"></span>Đang xử lý...';
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) { showMsg(data.error || 'Đăng nhập thất bại.'); btn.disabled = false; btn.textContent = 'Đăng nhập'; return; }
      localStorage.setItem('hrm_token', data.token);
      localStorage.setItem('hrm_user', JSON.stringify(data.user));
      window.location.href = '/';
    } catch(err) {
      showMsg('Lỗi kết nối.'); btn.disabled = false; btn.textContent = 'Đăng nhập';
    }
  });

  // Register Handle
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMsg();
    const btn = document.getElementById('btnRegister');
    const fullName = document.getElementById('regName').value.trim();
    const username = document.getElementById('regUser').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPass').value;

    btn.disabled = true; btn.innerHTML = '<span class="spinner-sm"></span>Đang xử lý...';
    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fullName, username, email, password })
      });
      const data = await res.json();
      if (!res.ok) { showMsg(data.error || 'Đăng ký thất bại.'); btn.disabled = false; btn.textContent = 'Đăng ký'; return; }
      localStorage.setItem('hrm_token', data.token);
      localStorage.setItem('hrm_user', JSON.stringify(data.user));
      window.location.href = '/';
    } catch(err) {
      showMsg('Lỗi kết nối.'); btn.disabled = false; btn.textContent = 'Đăng ký';
    }
  });
</script>
</body>
</html>
